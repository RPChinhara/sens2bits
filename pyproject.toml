[project]
name = "sens2bits"
version = "0.1.0"
description = "Measure and allocate low-bit quantization sensitivity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "matplotlib",
    "pandas",
    "pyyaml",
    "torch",
    "transformers",
]

[project.scripts]
sens2bits = "sens2bits.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
